# CI: run the Playwright suite on every push and PR.
#
# Deploy gating: Cloudflare Pages currently auto-deploys main via its Git
# integration, so this workflow starts as an alarm, not a gate. To make tests
# actually BLOCK deploys:
#   1. Cloudflare dashboard → Workers & Pages → micromobilityrentals →
#      Settings → Builds & deployments → disable automatic production deploys.
#   2. Create an API token (Cloudflare dashboard → My Profile → API Tokens →
#      "Edit Cloudflare Workers" template works) and add two GitHub repo
#      secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# The deploy job below detects the secrets and takes over automatically.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run, so a deploy can be retried without an empty commit -- needed the day
  # Cloudflare's Git integration stopped building and there was nothing to push.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (eslint + tsc + i18n key parity)
        run: npm run lint
      # index.html is a generated artifact and the tests only ever load the BUILT file.
      # Without this, editing app.src.html and forgetting `npm run build:html` gives a
      # green run against stale code — and Pages then deploys that stale artifact.
      - name: index.html is up to date with app.src.html
        run: |
          npm run build:html
          git diff --exit-code -- index.html service-worker.js \
            || { echo '::error::index.html/service-worker.js are stale — run `npm run build:html` and commit the result.'; exit 1; }
      - name: dist/ assembles with every referenced asset present
        run: node scripts/assemble-dist.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: secrets
        name: Check for Cloudflare credentials
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.present != 'true'
        name: Skip (no Cloudflare token yet — Pages Git integration is deploying)
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping gated deploy."
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.present == 'true'
        run: npm ci && npm run build:dist
      - if: steps.secrets.outputs.present == 'true'
        name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=micromobilityrentals --branch=main
